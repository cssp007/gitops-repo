apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: application-dev
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/cssp007/gitops-repo.git
    targetRevision: main
    path: applicationsets/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

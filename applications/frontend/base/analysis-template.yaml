apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate

metadata:
  name: frontend-success-rate
  namespace: frontend

spec:

  metrics:

    - name: success-rate

      interval: 10s

      count: 3

      failureLimit: 1

      successCondition: result[0] >= 0.95

      provider:

        prometheus:

          address: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090

          query: |
            vectorb(1)
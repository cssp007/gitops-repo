apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: frontend
  namespace: frontend

spec:

  replicas: 3

  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: frontend

  template:

    metadata:
      labels:
        app: frontend

    spec:

      containers:

        - name: nginx

          image: nginx:1.27

          ports:

            - name: http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: http

            initialDelaySeconds: 3
            periodSeconds: 5

  strategy:

    canary:

      stableService: frontend-stable

      canaryService: frontend-canary

      trafficRouting:

        nginx:
          stableIngress: frontend-ingress

      steps:

        - setWeight: 10

        - pause:
            duration: 30s

        - analysis:

            templates:

              - templateName: frontend-success-rate

        - setWeight: 30

        - pause:
            duration: 30s

        - analysis:

            templates:

              - templateName: frontend-success-rate

        - setWeight: 50

        - pause:
            duration: 30s

        - analysis:

            templates:

              - templateName: frontend-success-rate

        - setWeight: 100
apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: frontend
  namespace: frontend
  annotations:
    notifications.argoproj.io/subscribe.on-rollout-completed.gmail: "pandey.somnath007@gmail.com"
    notifications.argoproj.io/subscribe.on-rollout-aborted.gmail: "pandey.somnath007@gmail.com"
    notifications.argoproj.io/subscribe.on-analysis-run-failed.gmail: "pandey.somnath007@gmail.com"
    notifications.argoproj.io/subscribe.on-analysis-run-error.gmail: "pandey.somnath007@gmail.com"

spec:

  replicas: 3

  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: frontend

  template:

    metadata:
      labels:
        app: frontend

    spec:
    
      imagePullSecrets:
        - name: dockerhub-secret

      containers:

        - name: nginx

          image: docker.io/cssp007143/rag-app:sha-1516ca5a850514d62b5876cd90dd5eaf8e8e09fe

          ports:

            - name: http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: http

            initialDelaySeconds: 3
            periodSeconds: 5

  strategy:

    canary:

      stableService: frontend-stable

      canaryService: frontend-canary

      trafficRouting:

        nginx:
          stableIngress: frontend-ingress

      steps:

        - setWeight: 10

        - pause:
            duration: 10s

        - analysis:

            templates:

              - templateName: frontend-success-rate

        - setWeight: 30

        - pause:
            duration: 10s

        - analysis:

            templates:

              - templateName: frontend-success-rate

        - setWeight: 50

        - pause:
            duration: 10s

        - analysis:

            templates:

              - templateName: frontend-success-rate

        - setWeight: 100
